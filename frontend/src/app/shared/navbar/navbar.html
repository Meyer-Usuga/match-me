<nav class="navbar">
  <div class="navbar__inner">
    <div class="navbar__brand">
      <img class="navbar__logo" src="/logo.png" alt="MatchMe" />
      <span class="navbar__brand-text">MatchMe</span>
    </div>

    <span class="navbar__divider" aria-hidden="true"></span>

    <div class="navbar__links">
      <a
        class="navbar__link"
        routerLink="/home"
        routerLinkActive="navbar__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        Inicio
      </a>
      <a
        class="navbar__link"
        [routerLink]="isLoggedIn ? '/dashboard' : null"
        routerLinkActive="navbar__link--active"
        (click)="onDashboardClick($event)"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          style="margin-right: 6px; vertical-align: middle;"
        >
          <rect x="3" y="3" width="7" height="9" />
          <rect x="14" y="3" width="7" height="5" />
          <rect x="14" y="12" width="7" height="9" />
          <rect x="3" y="16" width="7" height="5" />
        </svg>
        Mis Análisis
      </a>
    </div>

    <span class="navbar__divider" aria-hidden="true"></span>

    <div class="navbar__actions">
      @if (isLoggedIn) {
        <app-button variant="secondary" size="sm" (click)="logout()">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="margin-right: 6px; vertical-align: middle;"
            aria-hidden="true"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Cerrar sesión
        </app-button>
      } @else {
        <app-button variant="secondary" size="sm" routerLink="/login">Iniciar sesión</app-button>
        <app-button size="sm" routerLink="/analysis">Empezar ya mismo</app-button>
      }
    </div>
  </div>
</nav>

<app-modal
  [isOpen]="showAuthModal()"
  (close)="showAuthModal.set(false)"
>
  <div class="auth-modal-content">
    <div class="auth-modal-icon-container">
      <svg
        width="32"
        height="32"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <h2 class="auth-modal-title">Inicio de Sesión Requerido</h2>

    <p class="auth-modal-text">
      Debes estar registrado y haber iniciado sesión para poder guardar tus análisis y visualizar tu historial de registros.
    </p>

    <div class="auth-modal-actions">
      <app-button variant="secondary" size="md" (click)="showAuthModal.set(false)">
        Volver
      </app-button>
      <app-button size="md" routerLink="/login" (click)="showAuthModal.set(false)">
        Iniciar sesión
      </app-button>
    </div>
  </div>
</app-modal>
