<nav class="navbar">
  <div class="navbar__inner">
    <div class="navbar__brand">
      <img class="navbar__logo" src="/logo.png" alt="MatchMe" />
      <span class="navbar__brand-text">MatchMe</span>
    </div>

    <span class="navbar__divider" aria-hidden="true"></span>

    <div class="navbar__links">
      <a
        class="navbar__link"
        routerLink="/home"
        routerLinkActive="navbar__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        Inicio
      </a>
      @if (isLoggedIn) {
        <a
          class="navbar__link"
          routerLink="/dashboard"
          routerLinkActive="navbar__link--active"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            style="margin-right: 6px; vertical-align: middle;"
          >
            <rect x="3" y="3" width="7" height="9" />
            <rect x="14" y="3" width="7" height="5" />
            <rect x="14" y="12" width="7" height="9" />
            <rect x="3" y="16" width="7" height="5" />
          </svg>
          Mis Análisis
        </a>
      }
      <a class="navbar__link" routerLink="/home" fragment="como-funciona">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
        Cómo funciona
      </a>
      <a class="navbar__link" routerLink="/home" fragment="beneficios">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polygon
            points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
          />
        </svg>
        Beneficios
      </a>
    </div>

    <span class="navbar__divider" aria-hidden="true"></span>

    <div class="navbar__actions">
      @if (isLoggedIn) {
        <app-button variant="secondary" size="sm" (click)="logout()">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="margin-right: 6px; vertical-align: middle;"
            aria-hidden="true"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Cerrar sesión
        </app-button>
      } @else {
        <app-button variant="secondary" size="sm" routerLink="/login">Iniciar sesión</app-button>
        <app-button size="sm" routerLink="/analysis">Empezar ya mismo</app-button>
      }
    </div>
  </div>
</nav>
