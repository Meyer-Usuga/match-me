<div class="gauge">
  <svg class="gauge__ring" viewBox="0 0 120 120">
    <defs>
      <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F857C1" />
        <stop offset="50%" stop-color="#C85AF4" />
        <stop offset="100%" stop-color="#7C3AED" />
      </linearGradient>
    </defs>
    <circle class="gauge__bg" cx="60" cy="60" r="52" />
    <circle
      class="gauge__fill"
      cx="60"
      cy="60"
      r="52"
      stroke="url(#gaugeGrad)"
      stroke-dasharray="326.7"
      [attr.stroke-dashoffset]="gaugeOffset()"
    />
  </svg>
  <div class="gauge__text">
    <span class="gauge__value">{{ score() }}%</span>
    <span class="gauge__label">Match</span>
  </div>
</div>
