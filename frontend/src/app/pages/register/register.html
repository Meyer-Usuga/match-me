<div class="register">
  <app-navbar />

  <main class="register__body">
    <div class="register__content">
      <section class="register__hero">
        <div class="register__hero-content">
          <h1 class="register__title">Crear cuenta</h1>
          <p class="register__subtitle">Únete a MatchMe</p>
        </div>
      </section>

      <section class="register__card">
        <app-input
          id="name"
          label="Nombre"
          type="text"
          placeholder="Tu nombre"
          autocomplete="name"
          [value]="credentials().name"
          (valueChange)="onChange('name', $event)"
          [error]="isInvalid('name') ? 'Ingresa tu nombre' : undefined"
        />
        <app-input
          id="email"
          label="Correo electrónico"
          type="email"
          placeholder="tucorreo@ejemplo.com"
          autocomplete="email"
          [value]="credentials().email"
          (valueChange)="onChange('email', $event)"
          [error]="isInvalid('email') ? 'Ingresa un correo electrónico válido' : undefined"
        />
        <app-input
          id="password"
          label="Contraseña"
          type="password"
          placeholder="••••••••"
          autocomplete="new-password"
          [value]="credentials().password"
          (valueChange)="onChange('password', $event)"
          [error]="isInvalid('password') ? 'Ingresa tu contraseña' : undefined"
        />
        <app-input
          id="confirmPassword"
          label="Confirmar contraseña"
          type="password"
          placeholder="••••••••"
          autocomplete="new-password"
          [value]="credentials().confirmPassword"
          (valueChange)="onChange('confirmPassword', $event)"
          [error]="
            isInvalid('confirmPassword')
              ? 'Confirma tu contraseña'
              : confirmMismatch()
                ? 'Las contraseñas no coinciden'
                : undefined
          "
        />
        @if (errorMessage()) {
          <div class="register__error-text">
            {{ errorMessage() }}
          </div>
        }
        <app-button [full]="true" (click)="onSubmit()">Crear cuenta</app-button>

        <section class="register__benefits">
          <ul class="register__benefits-list">
            <li class="register__benefit">
              <svg
                class="register__benefit-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="20 6 9 17 4 12" />
              </svg>
              <span>Guarda y recupera tus análisis</span>
            </li>
            <li class="register__benefit">
              <svg
                class="register__benefit-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="20 6 9 17 4 12" />
              </svg>
              <span>Compara versiones de tu CV</span>
            </li>
            <li class="register__benefit">
              <svg
                class="register__benefit-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="20 6 9 17 4 12" />
              </svg>
              <span>Recomendaciones por oferta</span>
            </li>
          </ul>
        </section>
      </section>

      <p class="register__guest">
        ¿Ya tienes cuenta?
        <a class="register__guest-link" routerLink="/login">Inicia sesión</a>
      </p>
    </div>
  </main>
</div>
