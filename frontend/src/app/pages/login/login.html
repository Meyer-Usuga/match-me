<div class="login">
  <app-navbar />

  <main class="login__body">
    <div class="login__content">
      <section class="login__hero">
        <div class="login__hero-content">
          <h1 class="login__title">Iniciar sesión</h1>
          <p class="login__subtitle">Bienvenido de nuevo a MatchMe</p>
        </div>
      </section>

      <section class="login__card">
        <app-input
          id="email"
          label="Correo electrónico"
          type="email"
          placeholder="tucorreo@ejemplo.com"
          autocomplete="email"
          [value]="credentials().email"
          (valueChange)="onEmailChange($event)"
          [error]="isInvalid('email') ? 'Ingresa un correo electrónico válido' : undefined"
        />
        <app-input
          id="password"
          label="Contraseña"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
          [value]="credentials().password"
          (valueChange)="onPasswordChange($event)"
          [error]="isInvalid('password') ? 'Ingresa tu contraseña' : undefined"
        />
        @if (errorMessage()) {
          <div class="login__error-text">
            {{ errorMessage() }}
          </div>
        }
        <app-button [full]="true" (click)="onSubmit()">Iniciar sesión</app-button>

        <section class="login__benefits">
          <ul class="login__benefits-list">
            <li class="login__benefit">
              <svg
                class="login__benefit-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="20 6 9 17 4 12" />
              </svg>
              <span>Guarda y recupera tus análisis</span>
            </li>
            <li class="login__benefit">
              <svg
                class="login__benefit-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="20 6 9 17 4 12" />
              </svg>
              <span>Compara versiones de tu CV</span>
            </li>
            <li class="login__benefit">
              <svg
                class="login__benefit-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="20 6 9 17 4 12" />
              </svg>
              <span>Recomendaciones por oferta</span>
            </li>
          </ul>
        </section>
      </section>

      <p class="login__guest">
        ¿No tienes cuenta?
        <a class="login__guest-link" routerLink="/register">Regístrate</a>
      </p>
    </div>
  </main>
</div>
